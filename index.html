<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9 Works Theatrical | Manila, Philippines</title>
    <meta name="title" content="9 Works Theatrical | Manila, Philippines">
    <meta name="description" content="Official website of 9 Works Theatrical, premier theatre production company based in Manila, Philippines.">

    <!-- Open Graph / Facebook / Socials -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://9workstheatrical.com/">
    <meta property="og:title" content="9 Works Theatrical">
    <meta property="og:description" content="Premier theatre production company based in Manila, Philippines.">
    <meta property="og:image" content="https://9workstheatrical.com/images/og-preview.jpg">

    <link rel="icon" type="image/png" href="https://9workstheatrical.com/images/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        :root { --nine-works-blue: #0054a6; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            color: #1d1d1f; 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }

        .glass-social-dock { 
            position: fixed; 
            bottom: 2.5rem; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            border-radius: 999px; 
            padding: 0.8rem 2.2rem; 
            display: flex; 
            gap: 2.2rem; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            z-index: 100; 
        }
        .glass-social-dock a { color: #1d1d1f; font-size: 1.3rem; opacity: 0.6; transition: 0.3s; }
        .glass-social-dock a:hover { opacity: 1; transform: translateY(-3px); color: var(--nine-works-blue); }
    </style>
</head>
<body class="py-12 px-6">

    <!-- Header / Logo -->
    <header class="text-center mb-6">
        <a href="https://9workstheatrical.com">
            <img src="https://drive.google.com/thumbnail?id=1P6GlMPvfrKxeZdelIfjHhY378yYHA9bz&sz=w300" class="w-36 mx-auto hover:opacity-80 transition-opacity" alt="9 Works Theatrical Logo">
        </a>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-3xl mx-auto w-full text-center my-auto py-8">
        <span class="px-6 py-2 rounded-full bg-blue-50 text-[var(--nine-works-blue)] text-xs font-black uppercase tracking-widest">Now Casting</span>
        <h1 class="text-4xl md:text-5xl font-extrabold text-[var(--nine-works-blue)] mt-4 mb-4 tracking-tight">9 Works Theatrical</h1>
        <p class="text-zinc-600 text-base max-w-lg mx-auto mb-8">Auditions are now open for our upcoming production. Click below to secure your registration slot.</p>

        <!-- Audition Button -->
        <div class="mb-10">
            <a href="https://9workstheatrical.com/auditionform" class="inline-flex items-center justify-center gap-3 px-8 py-4 bg-[var(--nine-works-blue)] text-white font-bold text-sm uppercase tracking-wider rounded-xl shadow-lg shadow-blue-500/25 hover:bg-blue-700 hover:scale-[1.02] transition-all cursor-pointer">
                <i class="fa-solid fa-user-pen"></i> Register for Auditions
            </a>
        </div>

        <!-- Embedded Tumult Hype Container (If applicable) -->
        <div id="hype-container" class="w-full flex justify-center items-center">
            <!-- Hype animation files or landing visuals load here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center mt-12 mb-24">
        <p class="text-zinc-400 text-xs font-medium">© 2026 9 Works Theatrical. Manila, Philippines.</p>
    </footer>

    <!-- Floating Dock -->
    <div class="glass-social-dock">
        <a href="https://facebook.com/9workstheatrical" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="https://instagram.com/9workstheatrical" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://www.threads.net/@9workstheatrical" target="_blank" aria-label="Threads"><i class="fab fa-threads"></i></a>
    </div>

</body>
</html>
