<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. TECHNICAL BASICS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 2. SOCIAL MEDIA & SEO -->
    <title>9 Works Theatrical | Manila's Premiere Theatre Company</title>
    <meta name="title" content="9 Works Theatrical | Manila's Premiere Theatre Company">
    <meta name="description" content="Experience theater excellence in Manila. Discover our upcoming musical productions, cast announcements, and theater updates.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://9workstheatrical.com/">
    <meta property="og:title" content="9 Works Theatrical | Manila's Premiere Theatre Company">
    <meta property="og:description" content="Official website of 9 Works Theatrical. Musical theater excellence in the heart of Manila.">
    <meta property="og:image" content="https://9workstheatrical.com/images/og-preview.jpg">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://9workstheatrical.com/">
    <meta property="twitter:title" content="9 Works Theatrical">
    <meta property="twitter:description" content="Experience Broadway in Manila.">
    <meta property="twitter:image" content="https://9workstheatrical.com/images/og-preview.jpg">

    <!-- 3. FAVICON -->
    <link rel="icon" type="image/png" href="https://9workstheatrical.com/images/favicon.png">

    <!-- 4. EXTERNAL SCRIPTS & STYLES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        :root { --nine-works-blue: #0054a6; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1d1d1f; margin: 0; overflow-x: hidden; scroll-behavior: smooth; }
        
        /* LOADER */
        #loader { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
        .loader-logo { width: 240px; margin-bottom: 2rem; }
        .progress-container { width: 220px; height: 4px; background: #f1f5f9; border-radius: 10px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--nine-works-blue); transition: width 0.4s ease; }

        /* POSTERS */
        .poster-frame { 
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.12); 
            border-radius: 2rem; 
            overflow: hidden; 
            background: #f8fafc; 
            aspect-ratio: 2/3; 
            margin: 0 auto; 
            position: relative;
            cursor: pointer;
        }
        .poster-frame img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            transition: filter 0.4s ease, transform 0.4s ease; 
        }

        /* INTERACTIVE BLUR & OVERLAY ON TAP/CLICK */
        .poster-overlay {
            position: absolute;
            inset: 0;
            background: rgba(3, 21, 45, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.25rem;
            text-align: center;
            color: #ffffff;
            border-radius: 2rem;
            z-index: 10;
        }

        .poster-frame.active img {
            filter: blur(8px) brightness(0.4);
            transform: scale(1.05);
        }

        .poster-frame.active .poster-overlay {
            opacity: 1;
            visibility: visible;
        }

        /* THE TEAM */
        .team-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 4rem 2rem; max-width: 1200px; margin: 0 auto; }
        .team-member { width: 100%; max-width: 280px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        @media (min-width: 768px) { .team-member { width: calc(25% - 2rem); } }
        .team-circle { width: 12rem; height: 12rem; margin-bottom: 1.5rem; border-radius: 50%; overflow: hidden; background: #f8fafc; box-shadow: 0 10px 30px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; }
        .team-circle img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; filter: grayscale(100%); transition: 0.6s ease; }
        .team-circle:hover img { filter: grayscale(0%); transform: scale(1.08); }

        /* INVERTED V BACK TO TOP */
        #back-to-top { 
            position: fixed; bottom: 3rem; right: 2.5rem; 
            width: 28px; height: 28px; 
            border-left: 6px solid var(--nine-works-blue);
            border-top: 6px solid var(--nine-works-blue);
            transform: rotate(45deg);
            cursor: pointer; opacity: 0; visibility: hidden; transition: 0.4s; z-index: 90;
        }
        #back-to-top.visible { opacity: 0.7; visibility: visible; animation: v-bounce 2s infinite; }
        @keyframes v-bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0) rotate(45deg); } 40% { transform: translateY(-10px) rotate(45deg); } 60% { transform: translateY(-5px) rotate(45deg); } }

        /* LIQUID GLASS SOCIAL DOCK */
        .glass-social-dock { position: fixed; bottom: 2.5rem; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 999px; padding: 0.8rem 2.2rem; display: flex; gap: 2.2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 100; }
        .glass-social-dock a { color: #1d1d1f; font-size: 1.3rem; opacity: 0.6; transition: 0.3s; }
        .glass-social-dock a:hover { opacity: 1; transform: translateY(-3px); color: var(--nine-works-blue); }

        #sticky-header { transition: 0.4s; transform: translateY(-100%); background: white; border-bottom: 1px solid #eee; z-index: 100; position: fixed; top: 0; width: 100%; padding: 1rem; }
        #sticky-header.visible { transform: translateY(0); }
    </style>
</head>
<body>

    <div id="loader">
        <img src="https://drive.google.com/thumbnail?id=1P6GlMPvfrKxeZdelIfjHhY378yYHA9bz&sz=w600" class="loader-logo">
        <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
    </div>

    <header id="sticky-header">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-4">
            <img src="https://drive.google.com/thumbnail?id=1P6GlMPvfrKxeZdelIfjHhY378yYHA9bz&sz=w200" class="w-16 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            <nav class="hidden md:flex gap-6 text-sm font-semibold text-zinc-600">
                <a href="#auditions-section" class="hover:text-[var(--nine-works-blue)] transition-colors">Auditions</a>
            </nav>
        </div>
    </header>

    <main id="main-content" class="opacity-0 transition-opacity duration-700">
        
        <!-- NOW PLAYING SECTION (DYNAMIC VIA SHEET) -->
        <section id="now-playing-section" class="py-32 px-6 hidden text-center">
            <div data-aos="fade-down" class="mb-10"><span class="px-8 py-2 rounded-full bg-blue-50 text-[var(--nine-works-blue)] text-sm font-black uppercase tracking-widest">Now Playing</span></div>
            <div id="hero-content"></div>
        </section>

        <!-- COMING SOON SECTION -->
        <section id="coming-soon-section" class="py-24 px-6 max-w-7xl mx-auto border-t border-zinc-100 hidden">
            <h2 class="text-center text-4xl font-extrabold text-[var(--nine-works-blue)] mb-16">Coming Soon</h2>
            <div id="coming-soon-grid" class="flex flex-wrap justify-center gap-12"></div>
        </section>

        <!-- PAST SHOWS (REVERSED ORDER WITH TAP/CLICK DETAILS OVERLAY) -->
        <section class="py-24 px-6 max-w-7xl mx-auto border-t border-zinc-100">
            <h2 class="text-center text-4xl font-extrabold text-[var(--nine-works-blue)] mb-4">Past Shows</h2>
            <p class="text-center text-zinc-400 text-sm mb-16">Tap or click any poster for show details</p>
            <div id="archive-grid" class="grid grid-cols-2 md:grid-cols-4 gap-8"></div>
        </section>

        <!-- AUDITIONS REGISTRATION SECTION (AT BOTTOM) -->
        <section id="auditions-section" class="py-24 px-6 max-w-3xl mx-auto border-t border-zinc-100">
            <div class="text-center mb-12" data-aos="fade-up">
                <span class="px-6 py-2 rounded-full bg-blue-50 text-[var(--nine-works-blue)] text-xs font-black uppercase tracking-widest">Join Our Cast</span>
                <h2 class="text-4xl font-extrabold text-[var(--nine-works-blue)] mt-4 mb-3">Audition Registration</h2>
                <p class="text-zinc-500 text-sm max-w-lg mx-auto">Fill out your details below to securely register and automatically receive your queue time slot.</p>
            </div>

            <div class="bg-white rounded-3xl p-8 md:p-12 shadow-xl border border-slate-100" data-aos="fade-up" data-aos-delay="100">
                <form id="auditionForm">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label for="lastName" class="block font-semibold text-xs uppercase tracking-wider text-zinc-600 mb-2">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" required placeholder="Doe" class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:border-[var(--nine-works-blue)] focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm">
                        </div>
                        <div>
                            <label for="firstName" class="block font-semibold text-xs uppercase tracking-wider text-zinc-600 mb-2">First Name *</label>
                            <input type="text" id="firstName" name="firstName" required placeholder="Jane" class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:border-[var(--nine-works-blue)] focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm">
                        </div>
                    </div>

                    <div class="mb-6">
                        <label for="email" class="block font-semibold text-xs uppercase tracking-wider text-zinc-600 mb-2">Email Address *</label>
                        <input type="email" id="email" name="email" required placeholder="jane.doe@example.com" class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:border-[var(--nine-works-blue)] focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm">
                    </div>

                    <div class="mb-8">
                        <label for="contact" class="block font-semibold text-xs uppercase tracking-wider text-zinc-600 mb-2">Contact Number *</label>
                        <input type="tel" id="contact" name="contact" required placeholder="+63 917 123 4567" class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:border-[var(--nine-works-blue)] focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full py-4 bg-[var(--nine-works-blue)] text-white rounded-xl font-bold text-sm tracking-wider uppercase shadow-lg shadow-blue-500/20 hover:bg-blue-700 transition-all cursor-pointer">Register for Auditions</button>
                </form>

                <!-- Confirmation Message Box -->
                <div id="responseMessage" class="hidden mt-6 p-5 rounded-xl text-center text-sm font-medium"></div>
            </div>
        </section>

        <!-- THE TEAM -->
        <section id="team-section" class="py-32 bg-zinc-50 px-6 hidden">
            <h2 class="text-center text-4xl font-extrabold text-[var(--nine-works-blue)] mb-20">The Team</h2>
            <div id="team-grid" class="team-container"></div>
        </section>
        
        <footer class="py-32 text-center pb-48 border-t border-zinc-100">
            <p class="text-zinc-400 text-sm font-medium">© 2026 9 Works Theatrical. Manila, Philippines.</p>
        </footer>
    </main>

    <div class="glass-social-dock">
        <a href="https://facebook.com/9workstheatrical" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="https://instagram.com/9workstheatrical" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.threads.net/@9workstheatrical" target="_blank"><i class="fab fa-threads"></i></a>
    </div>

    <div id="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"></div>

    <script>
        // Separate URLs for website show data vs. audition form submission
        const SHOWS_API_URL = 'https://script.google.com/macros/s/AKfycbxqLYJf6NWT3uHYHKNW18qTeC2llRZrxpQv2-MpKGizMGfeFWagzGMD-NAaOU4VdB9j/exec';
        const AUDITION_API_URL = 'https://script.google.com/macros/s/AKfycbwIzXLlOViZugmypgcjo3lYrVFelS6NTflQnkP_1Pd9ghDzfUsOFJa1ozT1H4gUnksRRg/exec';

        function getVal(obj, keyName) { const foundKey = Object.keys(obj || {}).find(k => k.trim().toLowerCase() === keyName.toLowerCase()); return foundKey ? String(obj[foundKey]).trim() : ""; }

        function togglePoster(frameElement) {
            document.querySelectorAll('.poster-frame.active').forEach(el => {
                if (el !== frameElement) el.classList.remove('active');
            });
            frameElement.classList.toggle('active');
        }

        async function init() {
            try {
                // Fetch shows & team data from SHOWS_API_URL
                const response = await fetch(SHOWS_API_URL);
                const data = await response.json();
                const shows = data.shows || [];
                const current = shows.filter(s => getVal(s, 'Type').toLowerCase().includes('current'));
                const coming = shows.filter(s => getVal(s, 'Type').toLowerCase().includes('coming'));
                const past = shows.filter(s => getVal(s, 'Type').toLowerCase().includes('past'));

                if (current.length > 0) {
                    document.getElementById('now-playing-section').classList.remove('hidden');
                    document.getElementById('hero-content').innerHTML = current.map(s => `
                        <div class="mb-20" data-aos="zoom-in">
                            <div class="poster-frame max-w-[480px] mb-10"><img src="${getVal(s, 'Poster')}"></div>
                            <h1 class="text-6xl md:text-8xl font-extrabold tracking-tighter mb-4">${getVal(s, 'Title')}</h1>
                            <p class="text-[var(--nine-works-blue)] text-xl font-bold uppercase tracking-widest">${getVal(s, 'Date') || getVal(s, 'Year')}</p>
                            <p class="max-w-[700px] italic px-6 mx-auto mt-6 text-zinc-600 text-lg leading-relaxed">${getVal(s, 'Description')}</p>
                            <div class="mt-10"><a href="https://ticket2me.net/event/22944" target="_blank" class="bg-[var(--nine-works-blue)] text-white px-14 py-5 rounded-full font-bold text-xl shadow-2xl inline-block hover:scale-105 transition-transform">Buy Tickets</a></div>
                        </div>`).join('');
                }

                if (coming.length > 0) {
                    document.getElementById('coming-soon-section').classList.remove('hidden');
                    document.getElementById('coming-soon-grid').innerHTML = coming.map(s => `
                        <div class="text-center w-full md:w-[calc(50%-2rem)] max-w-2xl" data-aos="fade-up">
                            <div class="poster-frame max-w-[380px] mb-6"><img src="${getVal(s, 'Poster')}"></div>
                            <h4 class="font-bold text-3xl mb-2">${getVal(s, 'Title')}</h4>
                            <p class="text-[var(--nine-works-blue)] text-sm font-black uppercase tracking-widest mb-4">${getVal(s, 'Date') || getVal(s, 'Year')}</p>
                            <p class="max-w-[500px] text-sm px-4 mx-auto text-zinc-500 leading-relaxed">${getVal(s, 'Description')}</p>
                        </div>`).join('');
                }

                const reversedPast = [...past].reverse();
                document.getElementById('archive-grid').innerHTML = reversedPast.map(s => {
                    const desc = getVal(s, 'Description');
                    const formattedDesc = desc ? desc.replace(/\|/g, '<br>') : 'Details coming soon.';
                    return `
                    <div class="text-center" data-aos="fade-up">
                        <div class="poster-frame max-w-[280px] mb-6" onclick="togglePoster(this)">
                            <img src="${getVal(s, 'Poster')}">
                            <div class="poster-overlay">
                                <h5 class="font-extrabold text-base md:text-lg mb-3 text-blue-300">${getVal(s, 'Title')}</h5>
                                <div class="text-xs md:text-sm text-slate-100 font-medium leading-relaxed overflow-y-auto max-h-[85%]">
                                    ${formattedDesc}
                                </div>
                            </div>
                        </div>
                        <h4 class="font-bold text-lg leading-tight px-2">${getVal(s, 'Title')}</h4>
                        <p class="text-zinc-400 text-xs font-bold uppercase mt-2">${getVal(s, 'Year')}</p>
                    </div>`;
                }).join('');

                if (data.team && data.team.length > 0) {
                    document.getElementById('team-section').classList.remove('hidden');
                    document.getElementById('team-grid').innerHTML = data.team.map(p => `
                        <div class="team-member" data-aos="fade-up">
                            <div class="team-circle"><img src="${getVal(p, 'Photo')}"></div>
                            <h4 class="font-bold text-xl leading-tight">${getVal(p, 'Name')}</h4>
                            <p class="text-[var(--nine-works-blue)] text-[11px] font-black uppercase tracking-widest mt-3 leading-relaxed px-4">${getVal(p, 'Role')}</p>
                        </div>`).join('');
                }

                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('main-content').classList.remove('opacity-0');
                    AOS.init({ once: true, duration: 800 });
                }, 600);
            } catch (err) { console.error(err); }
        }
        window.onload = init;
        window.addEventListener('scroll', () => {
            document.getElementById('sticky-header').classList.toggle('visible', window.scrollY > 400);
            document.getElementById('back-to-top').classList.toggle('visible', window.scrollY > 600);
        });

        // AUDITION FORM SUBMISSION HANDLER
        const auditionForm = document.getElementById("auditionForm");
        const submitBtn = document.getElementById("submitBtn");
        const responseMsg = document.getElementById("responseMessage");

        auditionForm.addEventListener("submit", function (e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "Registering...";
            responseMsg.className = "hidden";

            const payload = {
                lastName: document.getElementById("lastName").value.trim(),
                firstName: document.getElementById("firstName").value.trim(),
                email: document.getElementById("email").value.trim(),
                contact: document.getElementById("contact").value.trim()
            };

            fetch(AUDITION_API_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    auditionForm.reset();
                    responseMsg.className = "block mt-6 p-5 rounded-xl text-center text-sm font-medium bg-emerald-50 text-emerald-800 border border-emerald-200";
                    responseMsg.innerHTML = `<strong>Registration Successful!</strong><br>Thank you, ${payload.firstName}. Your assigned slot is:<br><strong class="text-base text-emerald-900 mt-1 inline-block">${data.slot}</strong>`;
                } else {
                    throw new Error(data.message || "Something went wrong.");
                }
            })
            .catch(error => {
                responseMsg.className = "block mt-6 p-5 rounded-xl text-center text-sm font-medium bg-rose-50 text-rose-800 border border-rose-200";
                responseMsg.innerHTML = "<strong>Error:</strong> Failed to register. Please try again or contact support.";
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Register for Auditions";
            });
        });
    </script>
</body>
</html>
