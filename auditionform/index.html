<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audition Registration | 9 Works Theatrical</title>
    <meta name="title" content="Audition Registration | 9 Works Theatrical">
    <meta name="description" content="Register for upcoming auditions with 9 Works Theatrical in Manila, Philippines.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://9workstheatrical.com/auditionform">
    <meta property="og:title" content="Audition Registration | 9 Works Theatrical">
    <meta property="og:description" content="Register for upcoming auditions with 9 Works Theatrical.">
    <meta property="og:image" content="https://9workstheatrical.com/images/og-preview.jpg">

    <link rel="icon" type="image/png" href="https://9workstheatrical.com/images/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        :root { --nine-works-blue: #0054a6; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            color: #1d1d1f; 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }

        .glass-social-dock { 
            position: fixed; 
            bottom: 2.5rem; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            border-radius: 999px; 
            padding: 0.8rem 2.2rem; 
            display: flex; 
            gap: 2.2rem; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            z-index: 100; 
        }
        .glass-social-dock a { color: #1d1d1f; font-size: 1.3rem; opacity: 0.6; transition: 0.3s; }
        .glass-social-dock a:hover { opacity: 1; transform: translateY(-3px); color: var(--nine-works-blue); }
    </style>
</head>
<body class="py-12 px-6">

    <header class="text-center mb-8">
        <a href="https://9workstheatrical.com">
            <img src="https://drive.google.com/thumbnail?id=1P6GlMPvfrKxeZdelIfjHhY378yYHA9bz&sz=w300" class="w-32 mx-auto hover:opacity-80 transition-opacity" alt="9 Works Theatrical Logo">
        </a>
    </header>

    <main class="max-w-2xl mx-auto w-full my-auto">
        <div class="text-center mb-8">
            <span class="px-6 py-2 rounded-full bg-blue-50 text-[var(--nine-works-blue)] text-xs font-black uppercase tracking-widest">Join Our Cast</span>
            <h1 class="text-4xl font-extrabold text-[var(--nine-works-blue)] mt-4 mb-3">Audition Registration</h1>
            <p class="text-zinc-500 text-sm max-w-md mx-auto">Fill out your details below to securely register and automatically receive your audition queue slot.</p>
        </div>

        <div class="bg-white rounded-3xl p-8 md:p-12 shadow-xl border border-slate-100">
            <form id="auditionForm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label for="lastName" class="block font-semibold text-xs uppercase tracking-wider text-zinc-600 mb-2">Last Name *</label>
                        <input type="text" id="lastName" name="lastName" required placeholder="Doe" class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:border-[var(--nine-works-blue)] focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm">
                    </div>
                    <div>
                        <label for="firstName" class="block font-semibold text-xs uppercase tracking-wider text-zinc-600 mb-2">First Name *</label>
                        <input type="text" id="firstName" name="firstName" required placeholder="Jane" class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:border-[var(--nine-works-blue)] focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm">
                    </div>
                </div>

                <div class="mb-6">
                    <label for="email" class="block font-semibold text-xs uppercase tracking-wider text-zinc-600 mb-2">Email Address *</label>
                    <input type="email" id="email" name="email" required placeholder="jane.doe@example.com" class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:border-[var(--nine-works-blue)] focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm">
                </div>

                <div class="mb-8">
                    <label for="contact" class="block font-semibold text-xs uppercase tracking-wider text-zinc-600 mb-2">Contact Number *</label>
                    <input type="tel" id="contact" name="contact" required placeholder="09171234567 or +639171234567" class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:border-[var(--nine-works-blue)] focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm">
                </div>

                <button type="submit" id="submitBtn" class="w-full py-4 bg-[var(--nine-works-blue)] text-white rounded-xl font-bold text-sm tracking-wider uppercase shadow-lg shadow-blue-500/20 hover:bg-blue-700 transition-all cursor-pointer">Register for Auditions</button>
            </form>

            <div id="responseMessage" class="hidden mt-6 p-5 rounded-xl text-center text-sm font-medium"></div>
        </div>
    </main>

    <footer class="text-center mt-12 mb-24">
        <p class="text-zinc-400 text-xs font-medium">© 2026 9 Works Theatrical. Manila, Philippines.</p>
    </footer>

    <div class="glass-social-dock">
        <a href="https://facebook.com/9workstheatrical" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="https://instagram.com/9workstheatrical" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.threads.net/@9workstheatrical" target="_blank"><i class="fab fa-threads"></i></a>
    </div>

    <script>
        const AUDITION_API_URL = 'https://script.google.com/macros/s/AKfycbwIzXLlOViZugmypgcjo3lYrVFelS6NTflQnkP_1Pd9ghDzfUsOFJa1ozT1H4gUnksRRg/exec';

        const auditionForm = document.getElementById("auditionForm");
        const submitBtn = document.getElementById("submitBtn");
        const responseMsg = document.getElementById("responseMessage");

        auditionForm.addEventListener("submit", function (e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "Registering...";
            responseMsg.className = "hidden";

            const firstNameVal = document.getElementById("firstName").value.trim();

            const formData = new URLSearchParams();
            formData.append("lastName", document.getElementById("lastName").value.trim());
            formData.append("firstName", firstNameVal);
            formData.append("email", document.getElementById("email").value.trim());
            formData.append("contact", document.getElementById("contact").value.trim());

            fetch(AUDITION_API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData.toString()
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    auditionForm.reset();
                    responseMsg.className = "block mt-6 p-5 rounded-xl text-center text-sm font-medium bg-emerald-50 text-emerald-800 border border-emerald-200";
                    responseMsg.innerHTML = `<strong>Registration Successful!</strong><br>Thank you, ${firstNameVal || 'Auditionee'}. Your assigned slot is:<br><strong class="text-base text-emerald-900 mt-1 inline-block">${data.slot}</strong><br><span class="block mt-2 font-semibold text-emerald-900">Please come 30 minutes before your Time Slot.</span>`;
                } else {
                    throw new Error(data.message || "Something went wrong.");
                }
            })
            .catch(error => {
                console.error("Submission error:", error);
                responseMsg.className = "block mt-6 p-5 rounded-xl text-center text-sm font-medium bg-rose-50 text-rose-800 border border-rose-200";
                responseMsg.innerHTML = "<strong>Error:</strong> Failed to register. Please try again or contact support.";
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Register for Auditions";
            });
        });
    </script>
</body>
</html>
